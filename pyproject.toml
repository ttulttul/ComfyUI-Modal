[project]
name = "modal-sync"
version = "0.2.3"
description = "ComfyUI nodes for Modal-backed workflow execution and hosted model endpoints."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11",
    "keyring>=25.6,<26",
]
classifiers = [
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
local-apple = [
    "mlx-vlm==0.6.15; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "psutil>=7,<8; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
remote = [
    "modal==1.4.2",
]

[project.urls]
Repository = "https://github.com/ttulttul/ComfyUI-Modal"
"Bug Tracker" = "https://github.com/ttulttul/ComfyUI-Modal/issues"

[dependency-groups]
test = [
    "aiohttp",
    "comfy-aimdo==0.4.13",
    "comfy-kitchen==0.2.31",
    "einops",
    "numpy",
    "pillow",
    "psutil",
    "pypdf",
    "pytest",
    "pyyaml",
    "safetensors",
    "scipy",
    "torch",
    "torchaudio>=2.11.0",
    "torchvision",
    "tqdm",
    "transformers",
]

[tool.comfy]
PublisherId = "ttulttul"
DisplayName = "Modal Sync"
Icon = "https://raw.githubusercontent.com/ttulttul/ComfyUI-Modal/main/icon.jpg"
requires-comfyui = ">=0.11.1"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_modal: opt-in tests that use authenticated, billable Modal resources",
]

[tool.uv]
package = false
