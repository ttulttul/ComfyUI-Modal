[project]
name = "modal-sync"
version = "0.1.18"
description = "ComfyUI custom node extension for routing marked nodes to Modal-backed execution."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
remote = [
    "modal==1.4.2",
]

[project.urls]
Repository = "https://github.com/ttulttul/ComfyUI-Modal"
"Bug Tracker" = "https://github.com/ttulttul/ComfyUI-Modal/issues"

[dependency-groups]
test = [
    "aiohttp",
    "comfy-aimdo==0.4.11",
    "comfy-kitchen==0.2.26",
    "einops",
    "numpy",
    "pillow",
    "psutil",
    "pytest",
    "pyyaml",
    "safetensors",
    "scipy",
    "torch",
    "torchaudio>=2.11.0",
    "torchvision",
    "tqdm",
    "transformers",
]

[tool.comfy]
PublisherId = "ttulttul"
DisplayName = "Modal Sync"
Icon = "https://raw.githubusercontent.com/ttulttul/ComfyUI-Modal/main/icon.jpg"
requires-comfyui = ">=0.11.1"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_modal: opt-in tests that use authenticated, billable Modal resources",
]

[tool.uv]
package = false
